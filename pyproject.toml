# Packaging for `uvx --from git+https://github.com/eric2q/prisma-sase-plugin`.
#
# This is what makes "push to main -> users get it on next restart" work: uvx
# resolves the git ref on every launch, so there is no installed copy to go
# stale. It is the Python equivalent of the `npx -y github:owner/repo` pattern.
#
# The version below is one of the declaration points PUBLISHING.md requires to
# move together; tools/test-regressions.py fails the build if it drifts from
# src/prisma_sase_mcp/config.py.

[project]
name = "prisma-sase-mcp"
version = "0.9.2"
description = "Read-only MCP server for Prisma SASE (Prisma Access): alerts, tunnels, Mobile Users and ADEM."
readme = "README.md"
requires-python = ">=3.10"       # fastmcp floor
license = { text = "MIT" }
authors = [{ name = "Eric (Solutions Consultant, Palo Alto Networks)" }]
keywords = ["prisma-sase", "prisma-access", "sase", "mcp", "adem", "read-only"]

# Kept in lockstep with src/prisma_sase_mcp/requirements.txt, which the
# run.sh / standalone launch paths still read.
dependencies = [
    "fastmcp>=2,<4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/eric2q/prisma-sase-plugin"
Repository = "https://github.com/eric2q/prisma-sase-plugin"

[project.scripts]
prisma-sase-mcp = "prisma_sase_mcp.__main__:main"
prisma-sase-setup = "prisma_sase_mcp.__main__:setup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prisma_sase_mcp"]
